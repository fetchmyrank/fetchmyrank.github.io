name: Build maps
on:
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", ".github/workflows/build.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==10.4.0 requests==2.32.3
      - name: Cache map tiles
        uses: actions/cache@v4
        with:
          path: .tiles
          key: tiles-${{ github.run_id }}
          restore-keys: tiles-
      - run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
